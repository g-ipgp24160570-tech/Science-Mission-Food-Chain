<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Science Mission: Food Chain</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        #objective-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            width: 320px;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 5px solid #4CAF50;
        }
        #interaction-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .dialog-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            pointer-events: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 80%;
            min-width: 300px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #45a049;
        }
        button.danger {
            background: #f44336;
        }
        button.danger:hover {
            background: #da190b;
        }
        #mobile-controls {
            display: none;
            pointer-events: auto;
        }
        /* Mobile Detection */
        @media (max-width: 768px) {
            #mobile-controls {
                display: flex;
                justify-content: space-between;
                width: 100%;
                margin-bottom: 20px;
            }
            .d-pad, .action-btn {
                background: rgba(255,255,255,0.7);
                width: 80px;
                height: 80px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                color: #333;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0,0,0,0.5);
        }
        
        input[type="text"] {
            padding: 10px;
            width: 80%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div id="objective-panel">
            <h3 style="margin-top:0; color:#333;">Food Chain Mission</h3>
            <p id="objective-text"><strong>Level 1:</strong> Find an organism that can make its own food (Producer).</p>
            <p><strong>Score:</strong> <span id="score-display">0</span></p>
        </div>

        <div id="crosshair"></div>
        <div id="interaction-prompt">Press 'E' or Tap to Interact</div>

        <!-- Question Dialog -->
        <div id="question-dialog" class="dialog-box">
            <h2 id="q-title">Object Found!</h2>
            <p id="q-text">Is this green object a producer?</p>
            <div class="btn-container">
                <button onclick="checkAnswer(true)">Yes, it makes its own food</button>
                <button class="danger" onclick="checkAnswer(false)">No, it eats other organisms</button>
            </div>
        </div>

        <!-- Custom Message Box (Replaces alert) -->
        <div id="message-dialog" class="dialog-box" style="z-index: 100;">
            <h2 id="msg-title">Message</h2>
            <p id="msg-text">Text goes here.</p>
            <button onclick="closeMessage()">Continue</button>
        </div>

        <!-- End Dialog & Google Sheets Submission -->
        <div id="end-dialog" class="dialog-box">
            <h2>Mission Complete!</h2>
            <p>Congratulations! You have completed the basic level.</p>
            <input type="text" id="playerName" placeholder="Enter your name">
            <button onclick="sendDataToSheets()">Submit Score to Teacher</button>
            <p id="send-status" style="color: #666; font-size: 14px; margin-top: 10px; font-weight: bold;"></p>
        </div>

        <div id="mobile-controls">
            <div class="d-pad" id="joystick">Move</div>
            <div class="action-btn" id="action-btn">Interact</div>
        </div>
    </div>

<script>
    // --- GOOGLE APPS SCRIPT CONFIGURATION ---
    // Paste your Web App URL here after deploying the Apps Script
    const APPS_SCRIPT_URL = "INSERT_YOUR_WEB_APP_URL_HERE";

    // --- GAME VARIABLES ---
    let scene, camera, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let prevTime = performance.now();
    let interactableObjects = [];
    let raycaster = new THREE.Raycaster();
    let cameraDirection = new THREE.Vector3();
    
    // Player Status
    let score = 0;
    let currentLevel = 1;
    let isDialogActive = false;
    let targetObject = null;
    let messageCallback = null;

    init();
    animate();

    function init() {
        const container = document.getElementById('game-container');

        // Scene & Camera
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky color
        scene.fog = new THREE.Fog(0x87CEEB, 0, 50);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.y = 1.6; // Player eye level

        // Lighting
        const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
        light.position.set(0.5, 1, 0.75);
        scene.add(light);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Floor Geometry
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x556B2F });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Build Maze Walls
        buildMaze();

        // Interactive Object (Level 1: Producer - Plant/Green Cube)
        const plantGeo = new THREE.BoxGeometry(1.2, 1.5, 1.2);
        const plantMat = new THREE.MeshLambertMaterial({ color: 0x228B22 }); // Forest Green
        const plant = new THREE.Mesh(plantGeo, plantMat);
        plant.position.set(0, 0.75, -6);
        plant.userData = { type: 'producer', isInteractive: true };
        scene.add(plant);
        interactableObjects.push(plant);

        // Renderer Setup
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Desktop Controls Events
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        
        // Simple Mouse Look (Pointer Lock)
        container.addEventListener('click', () => {
            if (!isDialogActive) {
                document.body.requestPointerLock();
            }
        });
        document.addEventListener('mousemove', onMouseMove);
        window.addEventListener('resize', onWindowResize);
        
        // Mobile Touch Events
        document.getElementById('action-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            attemptInteraction();
        });
        
        // Mobile movement simulation (simplified for testing)
        document.getElementById('joystick').addEventListener('touchstart', (e) => { e.preventDefault(); moveForward = true; });
        document.getElementById('joystick').addEventListener('touchend', (e) => { e.preventDefault(); moveForward = false; });
    }

    function buildMaze() {
        const wallMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 }); // Saddle Brown
        const wallGeo = new THREE.BoxGeometry(12, 3, 1);
        
        // Back wall to provide structure
        const wall1 = new THREE.Mesh(wallGeo, wallMat);
        wall1.position.set(0, 1.5, -10);
        scene.add(wall1);
    }

    function onKeyDown(event) {
        if(isDialogActive) return;
        switch (event.code) {
            case 'ArrowUp':
            case 'KeyW': moveForward = true; break;
            case 'ArrowLeft':
            case 'KeyA': moveLeft = true; break;
            case 'ArrowDown':
            case 'KeyS': moveBackward = true; break;
            case 'ArrowRight':
            case 'KeyD': moveRight = true; break;
            case 'KeyE': attemptInteraction(); break;
        }
    }

    function onKeyUp(event) {
        switch (event.code) {
            case 'ArrowUp':
            case 'KeyW': moveForward = false; break;
            case 'ArrowLeft':
            case 'KeyA': moveLeft = false; break;
            case 'ArrowDown':
            case 'KeyS': moveBackward = false; break;
            case 'ArrowRight':
            case 'KeyD': moveRight = false; break;
        }
    }

    function onMouseMove(event) {
        if (document.pointerLockElement === document.body && !isDialogActive) {
            camera.rotation.y -= event.movementX * 0.002;
            // Limit vertical rotation (look up/down)
            let pitch = camera.rotation.x - event.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            camera.rotation.order = "YXZ";
        }
    }

    // Custom Message Box Logic (Replaces Alert)
    function showMessage(title, text, callback) {
        isDialogActive = true;
        document.exitPointerLock();
        
        document.getElementById('msg-title').innerText = title;
        document.getElementById('msg-text').innerText = text;
        document.getElementById('message-dialog').style.display = 'block';
        
        messageCallback = callback;
    }

    window.closeMessage = function() {
        document.getElementById('message-dialog').style.display = 'none';
        if (messageCallback) {
            messageCallback();
        } else {
            isDialogActive = false;
        }
    }

    function attemptInteraction() {
        if(isDialogActive || !targetObject) return;
        
        if (targetObject.userData.type === 'producer' && currentLevel === 1) {
            isDialogActive = true;
            document.exitPointerLock();
            document.getElementById('question-dialog').style.display = 'block';
        }
    }

    // Learning Logic Function
    window.checkAnswer = function(isCorrect) {
        document.getElementById('question-dialog').style.display = 'none';
        
        if (isCorrect) {
            showMessage("Correct!", "Exactly! Plants are producers. They make their own food through photosynthesis using sunlight.", () => {
                score += 10;
                document.getElementById('score-display').innerText = score;
                document.getElementById('objective-text').innerHTML = "<strong>Status:</strong> Level 1 Complete!<br>Waiting for Level 2...";
                currentLevel++;
                
                // Show End Screen for this test phase
                setTimeout(() => {
                    isDialogActive = true;
                    document.getElementById('end-dialog').style.display = 'block';
                }, 500);
            });
        } else {
            showMessage("Try Again", "Not quite. Remember, green plants use sunlight to make their own food. They do not eat other organisms.", () => {
                isDialogActive = false; // Release lock so they can try again
            });
        }
    };

    // Google Sheets Apps Script Function
    window.sendDataToSheets = function() {
        const playerName = document.getElementById('playerName').value;
        const statusText = document.getElementById('send-status');
        
        if(!playerName) {
            statusText.innerText = "Please enter your name first.";
            statusText.style.color = "red";
            return;
        }

        if(APPS_SCRIPT_URL === "INSERT_YOUR_WEB_APP_URL_HERE") {
            statusText.innerText = "Error: APPS_SCRIPT_URL is not configured yet!";
            statusText.style.color = "red";
            return;
        }

        statusText.innerText = "Sending data securely to teacher...";
        statusText.style.color = "#333";

        const data = {
            name: playerName,
            score: score,
            levelReached: currentLevel,
            timestamp: new Date().toISOString()
        };

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Essential for Google Apps Script to bypass CORS policy
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        }).then(() => {
            // Because of 'no-cors', we can't read the exact response, but a resolution means it fired.
            statusText.innerText = "Success! Data sent to the Teacher's log.";
            statusText.style.color = "green";
        }).catch(error => {
            statusText.innerText = "Network Error: Could not reach the server.";
            statusText.style.color = "red";
        });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        if (!isDialogActive) {
            // Player Movement Physics
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize(); // Ensure consistent diagonal movement speed

            if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);

            // Keep camera at player height
            camera.position.y = 1.6;

            // Raycaster for detecting interactive objects (crosshair)
            camera.getWorldDirection(cameraDirection);
            raycaster.set(camera.position, cameraDirection);
            
            const intersects = raycaster.intersectObjects(interactableObjects);
            const promptUI = document.getElementById('interaction-prompt');
            
            if (intersects.length > 0 && intersects[0].distance < 4) {
                targetObject = intersects[0].object;
                promptUI.style.display = 'block';
            } else {
                targetObject = null;
                promptUI.style.display = 'none';
            }
        }

        prevTime = time;
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
